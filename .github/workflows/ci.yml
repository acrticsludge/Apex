name: CI

on:
  push:
    branches: [main, master, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Importing apex_dashboard must not touch Supabase or start the price thread.
  APEX_SKIP_AUTOSTART: "1"

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record the resolved versions
        # The numpy/pandas window is constrained by pandas-ta -> numba. Print what
        # actually resolved so a future failure is diagnosable from the log alone.
        run: pip list --format=freeze | grep -Ei '^(numpy|pandas|numba|pandas-ta|torch|stable-baselines3|scikit-learn|flask|yfinance)='

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Byte-compile everything
        run: python -m compileall -q apex_dashboard.py apex_jev.py apex_market.py apex_config.py apex_universe.py trading_agent tests

      - name: Run the suite
        env:
          APEX_USER: ci-user
          APEX_PASS: ci-password-not-a-real-secret
          APEX_SECRET: ci-session-secret
        run: pytest -q

      - name: Confirm JEV is live in the production import order
        # The circular-import defect this guards made every JEV risk gate a
        # silent no-op in production while the suite stayed green, because the
        # tests imported apex_jev first. Import the dashboard first, like
        # gunicorn does.
        run: |
          python - <<'PY'
          import apex_dashboard as d
          assert d._JEV_AVAILABLE, f"JEV disabled in production import order: {d._JEV_IMPORT_ERROR}"
          print("JEV active:", d._JEV_AVAILABLE)
          PY

      - name: Uploads the test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apex-log
          path: apex.log
          if-no-files-found: ignore

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Known-vulnerability check
        # PYSEC-2026-139 has no fixed release on any torch version, so it cannot
        # be cleared by a bump and must not mask the rest. Every other advisory
        # fails the job; this one is reported and allowed.
        run: |
          pip install -r requirements.txt
          pip install pip-audit
          set +e
          pip-audit --requirement requirements.txt --strict --format columns > /tmp/audit.txt 2>&1
          code=$?
          set -e
          cat /tmp/audit.txt
          unfixed=$(grep -c 'PYSEC-2026-139' /tmp/audit.txt || true)
          if [ "$code" -ne 0 ]; then
            remaining=$(grep -E '^[a-zA-Z0-9_-]+ +[0-9]' /tmp/audit.txt | grep -v 'PYSEC-2026-139' || true)
            if [ -n "$remaining" ]; then
              echo "::error::fixable advisories remain:"
              echo "$remaining"
              exit 1
            fi
            echo "::warning::only PYSEC-2026-139 (torch) remains; it has no fixed release. Occurrences: $unfixed"
          fi

  docker:
    name: image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build the deploy image
        run: docker build -t apex:ci .

      - name: The image must not contain .env or the log/state files
        run: |
          set -euo pipefail
          cid=$(docker create apex:ci)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          listing=$(docker export "$cid" -o /tmp/layer.tar && tar -tf /tmp/layer.tar)
          for bad in "^app/.env$" "^app/apex.log$" "^app/apex_dual_state.json$"; do
            if echo "$listing" | grep -Eq "$bad"; then
              echo "::error::image contains ${bad}"; exit 1
            fi
          done
          echo "image is clean of secrets and runtime state"
