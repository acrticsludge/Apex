[pytest]
testpaths = tests
# -q keeps CI logs readable; the suite is the gate, not the verbosity.
addopts = -q --strict-markers --strict-config
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Fail on an unhandled exception in a background thread. The agent thread dying
# silently is exactly the failure mode that stops live trading without a trace.
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
    default
